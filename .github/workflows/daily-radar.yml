name: Daily AI Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: Europe/Paris

permissions:
  contents: write

concurrency:
  group: daily-ai-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RADAR_AUTHOR_NAME: mairu1
      RADAR_AUTHOR_EMAIL: 87369480+mairu1@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test collectors and publishing
        run: python -m unittest discover -s tests -v
      - name: Collect public sources
        id: collect
        shell: bash
        run: |
          set +e
          python radar.py
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then
            exit "$result"
          fi
      - name: Commit new entries
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/entries.json digests/
          if git diff --cached --quiet; then
            echo 'No new entries; no commit needed.'
            exit 0
          fi
          GIT_AUTHOR_NAME="$RADAR_AUTHOR_NAME" GIT_AUTHOR_EMAIL="$RADAR_AUTHOR_EMAIL" \
            git commit -m 'docs: update AI digest (automated source collection)'
          git push
      - name: Flag unavailable sources
        if: steps.collect.outputs.result == '2'
        run: |
          echo '::error::Digest published with partial coverage. Check source warnings in collection logs.'
          exit 1
